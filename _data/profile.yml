short_bio: >-
  <p>
    I am an M.S. student in Computer Science at University of Illinois Urbana-Champaign (UIUC), advised by <a href="https://minjekim.com/" target="_blank">Prof. Minje Kim</a>. My research interests include but are not limited to audio understanding, multimodal learning, efficient deep learning.
  </p>
  <p>
    Previously, I worked at Samsung Electronics as  an AI researcher at <a href="https://research.samsung.com/" target="_blank">Samsung Research</a> and in the Mobile eXperience (MX) Business.
    I developed <a href="https://www.youtube.com/watch?v=sixEkGyg2O8" target="_blank">Audio Eraser</a> for the Galaxy S25 series
    and contributed to a diagnosis system for Samsung home appliances.
  </p>
  <p>
    I earned my B.S. in Industrial Engineering and Artificial Intelligence from <a href="https://en.snu.ac.kr/" target="_blank">Seoul National University</a>.
  </p>

